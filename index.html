<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divya Agro Farms ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .sidebar { height: 100vh; background-color: #212529; color: white; position: fixed; width: 250px; }
        .sidebar .brand { padding: 20px; font-size: 1.25rem; font-weight: bold; color: #198754; text-align: center; border-bottom: 1px solid #343a40; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; font-size: 0.95rem; }
        .sidebar a:hover, .sidebar a.active { background-color: #198754; color: white; border-radius: 4px; margin: 0 10px; padding: 12px 10px; }
        .main-content { margin-left: 250px; padding: 30px; }
        .module-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #dee2e6; padding-bottom: 15px; margin-bottom: 25px; }
        .admin-only { display: none; } /* Hidden by default, revealed via JS */
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <div class="brand">Divya Agro Farms</div>
        <div class="mt-3">
            <a href="#dashboard" class="active" onclick="loadModule('dashboard')">🏠 Dashboard</a>
            <a href="#customers" onclick="loadModule('customers')">👥 Customers</a>
            <a href="#quotations" onclick="loadModule('quotations')">📄 Quotations</a>
            <a href="#invoices" onclick="loadModule('invoices')">🧾 Invoices</a>
            <a href="#sales-purchases" onclick="loadModule('sales-purchases')">⇄ Sales & Purchases</a>
            <a href="#export" onclick="loadModule('export')">📤 Export Center</a>
            <a href="#bank-details" onclick="loadModule('bank-details')">🏦 Bank Details</a>
            <a href="#settings" class="admin-only" onclick="loadModule('settings')">⚙️ Settings</a>
            <a href="#audit-logs" class="admin-only" onclick="loadModule('audit-logs')">⏱️ Audit Logs</a>
            <a href="#users" class="admin-only" onclick="loadModule('users')">👤 Users</a>
        </div>
        <div style="position: absolute; bottom: 20px; width: 100%; text-align: center;">
            <button class="btn btn-outline-danger btn-sm w-75" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Dynamic Module Container -->
    <div class="main-content" id="app-container">
        <!-- Content injects here -->
        <h2 class="module-header">Loading...</h2>
    </div>

    <script>
        // Initialize Supabase
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentUserRole = 'Manager'; // Default fallback

        async function checkAuth() {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (!session) {
                // Redirect to a login.html (to be created)
                window.location.href = 'login.html'; 
                return;
            }
            
            // Fetch User Role
            const { data: profile } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', session.user.id)
                .single();
                
            if (profile) {
                currentUserRole = profile.role;
                applyRBAC();
            }
            
            loadModule('dashboard'); // Default view
        }

        function applyRBAC() {
            if (currentUserRole === 'Admin') {
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            }
        }

        function loadModule(moduleName) {
            // Update active state
            document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
            event.target.classList.add('active');

            // Placeholder for module routing (we will build distinct JS functions for each)
            const container = document.getElementById('app-container');
            container.innerHTML = <div class="module-header"><h2>${moduleName.toUpperCase()}</h2></div><p>Module logic will load here.</p>;
        }

        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        }

        // Boot
        checkAuth();
    </script>
</body>
</html>
