<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Divya Agro Farms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .sidebar { height: 100vh; background-color: #212529; color: white; position: fixed; width: 250px; }
        .sidebar .brand { padding: 20px; font-size: 1.25rem; font-weight: bold; color: #198754; text-align: center; border-bottom: 1px solid #343a40; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 12px 20px; display: block; font-size: 0.95rem; }
        .sidebar a:hover, .sidebar a.active { background-color: #198754; color: white; border-radius: 4px; margin: 0 10px; padding: 12px 10px; }
        .main-content { margin-left: 250px; padding: 30px; }
        .admin-only { display: none; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">Divya Agro Farms</div>
        <div class="mt-3">
            <a href="dashboard.html">🏠 Dashboard</a>
            <a href="customers.html" class="active">👥 Customers</a>
            <a href="users.html" class="admin-only">👤 Users</a>
        </div>
        <div style="position: absolute; bottom: 20px; width: 100%; text-align: center;">
            <button class="btn btn-outline-danger btn-sm w-75" onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center pb-3 border-bottom mb-4">
            <h2>Customer Management</h2>
            <button class="btn btn-primary" onclick="addCustomer()">+ New Customer</button>
        </div>
        
        <div class="table-responsive">
            <table class="table table-bordered align-middle bg-white">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="customer-list">
                    <tr><td colspan="4" class="text-center">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tnsyqmjwlbfxnbtgeols.supabase.co/';
        const SUPABASE_ANON_KEY = 'sb_publishable_YabrAV_WOZwybhr81HFOHg_yw5E9Yj2';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let isAdmin = false;

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = './index.html'; 
            
            const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', session.user.id).single();
            if (profile && profile.role === 'Admin') {
                isAdmin = true;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            }
            fetchCustomers();
        }

        async function fetchCustomers() {
            const { data, error } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('customer-list');
            
            if (error) {
                tbody.innerHTML = <tr><td colspan="4" class="text-danger">Error: ${error.message}</td></tr>;
                return;
            }
            
            tbody.innerHTML = data.map(c => `
                <tr>
                    <td>${c.name}</td>
                    <td>${c.phone || '-'}</td>
                    <td>${c.address || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger ${!isAdmin ? 'd-none' : ''}" onclick="deleteCustomer('${c.id}')">🗑️ Delete</button>
                    </td>
                </tr>
            ).join('') || `<tr><td colspan="4" class="text-center">No customers found.</td></tr>;
        }

        async function addCustomer() {
            const name = prompt("Enter Customer Name:");
            if (!name) return;
            const phone = prompt("Enter Phone Number:");
            const address = prompt("Enter Address:");

            const { error } = await supabaseClient.from('customers').insert([{ name, phone, address }]);
            if (error) alert("Error adding customer: " + error.message);
            else fetchCustomers();
        }

        async function deleteCustomer(id) {
            if (!confirm("Are you sure you want to delete this customer?")) return;
            const { error } = await supabaseClient.from('customers').delete().eq('id', id);
            if (error) alert("Error deleting customer: " + error.message);
            else fetchCustomers();
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = './index.html';
        }

        checkAuth();
    </script>
</body>
</html>
